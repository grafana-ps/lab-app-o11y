---
# Tested with grafana/k8s-monitoring 4.6.1 (Beyla 3.42.0).
cluster:
  # Set per cluster, for example --set cluster.name=<name>.
  name: my-cluster

# Grafana Cloud OTLP gateway. Credentials come from an existing Secret.
destinations:
  grafana-cloud-otlp:
    type: otlp
    protocol: http
    # Your stack's OTLP endpoint: Grafana Cloud portal > stack > OpenTelemetry.
    # Override with --set-string destinations.grafana-cloud-otlp.url=<url>
    # on every upgrade, also with --reuse-values: -f files win over reused
    # values, so this placeholder would replace the real URL.
    url: https://otlp-gateway-prod-<region>.grafana.net/otlp
    auth:
      type: basic
      usernameKey: username
      passwordKey: password
    secret:
      create: false
      name: grafana-cloud-credentials
    metrics: {enabled: true}
    logs: {enabled: true}
    traces: {enabled: true}
    # Label conventions: map non-OpenTelemetry names to OpenTelemetry semantic
    # conventions. Only what the chart does not already do. Already done by
    # chart 4.6.1, so not repeated here:
    #   - cluster.name -> both `cluster` and `k8s.cluster.name` on every signal
    #     (k8s_cluster_name in Prometheus). `cluster` stays: the Kubernetes
    #     Monitoring app queries it.
    #   - logs: namespace, pod, container, deployment, ... -> k8s.* resource
    #     attributes; service_name, deployment_environment(_name) -> OTel.
    #   - metrics: service_name, service_namespace, deployment_environment(_name)
    #     datapoint labels -> resource attributes.
    #   - SDK and Beyla telemetry: k8s.namespace.name, k8s.pod.name, ... set by
    #     the k8sattributes processor on the receiver.
    processors:
      # Refuse data before an OOM kill when bursts outgrow the collector. Set
      # below the alloy-deployment and alloy-daemonset memory limit (1Gi).
      # alloy-singleton (256Mi limit) carries only events and never gets
      # near it.
      memoryLimiter:
        enabled: true
        limit: 800MiB
      transform:
        metrics:
          # Promote per-series environment labels to the current semantic
          # convention. Overrides the chart default, which maps
          # deployment_environment to the deprecated deployment.environment.
          datapointToResource:
            deployment_environment: deployment.environment.name
            environment: deployment.environment.name
            env: deployment.environment.name
          # Resource-level spellings, for example an SDK still setting the
          # deprecated deployment.environment, or env/environment from
          # OTEL_RESOURCE_ATTRIBUTES. The original attribute is kept so
          # existing queries keep working.
          resource: &envResource
            - set(attributes["deployment.environment.name"], attributes["deployment.environment"]) where attributes["deployment.environment.name"] == nil and attributes["deployment.environment"] != nil
            - set(attributes["deployment.environment.name"], attributes["environment"]) where attributes["deployment.environment.name"] == nil and attributes["environment"] != nil
            - set(attributes["deployment.environment.name"], attributes["env"]) where attributes["deployment.environment.name"] == nil and attributes["env"] != nil
          # Scraped Prometheus series carry `namespace` per series (one
          # kube-state-metrics target reports every namespace), so this is a
          # datapoint-level copy, not a resource promotion. `namespace` stays
          # for the Kubernetes Monitoring app; the copy adds the
          # k8s_namespace_name label, no new series.
          datapoint:
            # Also skip when a flat k8s_namespace_name is already there (Beyla
            # sets one): both translate to the same Prometheus label and the
            # OTLP endpoint would join the values with ";".
            - set(attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["k8s.namespace.name"] == nil and attributes["k8s_namespace_name"] == nil and resource.attributes["k8s.namespace.name"] == nil and attributes["namespace"] != nil
        logs:
          logToResource:
            deployment_environment: deployment.environment.name
            environment: deployment.environment.name
            env: deployment.environment.name
          resource: *envResource
        traces:
          resource: *envResource

# OTLP receiver for traces, metrics and logs from applications. Injected SDKs
# and Beyla eBPF traces both land here, and Beyla refuses to start the
# injector unless this trace export exists.
applicationObservability:
  enabled: true
  collector: alloy-deployment
  # Derive service.name and service.namespace the OpenTelemetry way, the same
  # as pod logs below, so traces, metrics and logs of one workload agree.
  alignServiceNameWithOTelSemConv: true
  # Replace unknown_service[:<exe>] from SDKs without a configured name.
  overrideUnknownServiceNames: true
  receivers:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true
  # Filters drop whatever matches. Helm replaces lists instead of merging
  # them, so an overlay that sets one of these lists must repeat all entries.
  metrics:
    filters:
      metric:
        - IsMatch(resource.attributes["k8s.namespace.name"], "^(kube-system|kube-public|kube-node-lease)$")
  logs:
    filters:
      log_record:
        - IsMatch(resource.attributes["k8s.namespace.name"], "^(kube-system|kube-public|kube-node-lease)$")
  traces:
    enabled: true
    filters:
      span:
        # Cluster infrastructure namespaces
        - IsMatch(resource.attributes["k8s.namespace.name"], "^(kube-system|kube-public|kube-node-lease)$")
        # Health check and monitoring endpoints: high volume, no business
        # value. Anchored, so /api/healthcare or /v1/metrics-report survive.
        # Checked on url.path too: client spans and many Beyla spans have
        # no http.route.
        - IsMatch(attributes["http.route"], "^/(health|healthz|live|livez|ready|readyz|readiness|startup|heartbeat|ping|actuator|metrics)(/.*)?$")
        - IsMatch(attributes["url.path"], "^/(health|healthz|live|livez|ready|readyz|readiness|startup|heartbeat|ping|actuator|metrics)(/.*)?$")
        # Database ping operations: connection keep-alives, not useful for debugging
        - attributes["db.operation"] == "PING"
        - attributes["db.operation.name"] == "PING"
        # MongoDB driver handshakes and topology checks
        - IsMatch(attributes["db.operation.name"], "(?i)^(hello|ismaster|cluster)$")
        # Preflight and probe HTTP methods carry no useful trace data
        - attributes["http.method"] == "OPTIONS"
        - attributes["http.method"] == "HEAD"
        - attributes["http.request.method"] == "OPTIONS"
        - attributes["http.request.method"] == "HEAD"

# Cluster metrics: kubelet, cAdvisor, kube-state-metrics, API server.
# Needs the bundled kube-state-metrics (telemetryServices below).
clusterMetrics:
  enabled: true
  collector: alloy-daemonset

# Node-level metrics from the bundled node-exporter (telemetryServices below).
# Linux only here; add windowsHosts on mixed clusters.
hostMetrics:
  enabled: true
  collector: alloy-daemonset
  linuxHosts:
    enabled: true

# Kubernetes events as logs. Runs on a singleton collector so events are not
# collected twice.
clusterEvents:
  enabled: true
  collector: alloy-singleton

# Pod logs shipped as OTLP. Needs a DaemonSet collector with the
# filesystem-log-reader preset, which reads /var/log/pods on each node.
podLogsViaOpenTelemetry:
  enabled: true
  collector: alloy-daemonset
  # Same service.name derivation as applicationObservability.
  alignServiceNameWithOTelSemConv: true
  # resource.opentelemetry.io/<attr> pod annotations become resource
  # attributes, the same convention the OpenTelemetry Operator uses.
  otelAnnotations: true
  # Chart default, explicit so a first rollout never replays old log files.
  onlyGatherNewLogLines: true

# Scrapes pods and services carrying k8s.grafana.com annotations, including
# the injection controller's own metrics (beyla_injection_pods) so injection
# results are visible without kubectl.
annotationAutodiscovery:
  enabled: true
  collector: alloy-daemonset
  pods:
    enabled: true
  services:
    enabled: true

# Beyla as its own DaemonSet, in SDK injector mode.
autoInstrumentation:
  enabled: true
  collector: alloy-daemonset
  beyla:
    # Chart 4.6.1 bundles Beyla 3.40.0. Pin 3.42.0, the first stable
    # release with the Node.js route harvesting CPU fix
    # (open-telemetry/opentelemetry-ebpf-instrumentation#4004). Move to
    # 3.43.0 once it is stable: it adds the JVM heap metric fallback for
    # JVMs without HotSpot USDT probes (opentelemetry-ebpf-instrumentation#4172).
    # Drop this block once the chart bundles 3.43.0 or newer.
    image:
      tag: "3.42.0"
    # No podAnnotations override here: the chart's own default already sets
    # the two job annotations for Beyla, and Helm would replace the whole map.
    # Namespaced Role so the Beyla DaemonSet may write injector state
    # ConfigMaps.
    injector:
      enabled: true
    # Same as the main values file. Memory grows with the number of
    # instrumented processes; no CPU limit so eBPF event handling is not
    # throttled.
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        memory: 1Gi
    # Run on tainted nodes too (for example AKS system pools with
    # CriticalAddonsOnly), the same as the alloy-daemonset preset. Without it
    # those nodes get metrics and logs but no eBPF.
    tolerations:
      - operator: Exists
        effect: NoSchedule
    config:
      data:
        # The Java agent gives context propagation, TLS capture and JVM
        # class, thread, CPU and GC metrics. Busy JVMs often miss the default
        # 10s attach window ("java attach timed out"), so give them 30s.
        javaagent:
          attach_timeout: 30s
        discovery:
          # Belt and braces for eBPF. Nothing in these namespaces is
          # instrumented today because the scope is annotation opt-in, but an
          # explicit exclude also covers a pod there carrying the annotation
          # and any later widening of the scope. Exclusion wins over
          # instrument. Setting this key replaces the chart's own default
          # exclusion, so the executable pattern is repeated here; without it
          # Beyla would start instrumenting the collectors themselves.
          exclude_instrument:
            - exe_path: '{*alloy*,*otelcol*,*beyla*}'
            # CHANGE: monitoring is the release namespace.
            - k8s_namespace: '{kube-system,kube-public,kube-node-lease,monitoring}'
          instrument:
            - k8s_pod_annotations:
                k8s.grafana.com/ebpf: "true"
          # A service that already sends OpenTelemetry (injected or manual
          # SDK) gets no Beyla span metrics or service graph metrics, so its
          # RED metrics are not counted twice. Beyla still traces it.
          exclude_otel_instrumented_services_span_metrics: true

        # Global feature list for every Beyla exporter. Replaces the
        # deprecated prometheus_export.features, which would override it.
        # `application` = application_red plus four HTTP body-size
        # histograms; use application_red instead to skip those.
        # The chart sets its own prometheus_export.features (with `network`);
        # null removes it so this global list applies.
        prometheus_export:
          features: null
        metrics:
          features:
            - application
            # No `network`: flow metrics are high cardinality and need extra
            # Beyla network config. Add it only when network flows are a goal.
            - application_service_graph
            # Deprecated in Beyla, but Application Observability still reads
            # the traces_spanmetrics_* series it produces. Keep.
            - application_span
            - application_host
            - application_process
            # JVM, Node.js, Python, Go and .NET runtime metrics. Off by
            # default; without it the Java agent attaches but no JVM metrics
            # arrive.
            - application_runtime
        routes:
          unmatched: low-cardinality  # Capture outbound routes not explicitly defined
          # Mirrors the OTLP trace span filters above for consistency in what's dropped
          # Pattern syntax: /x matches exactly, /x/* matches the prefix. A
          # bare /x* is not documented, so each path is listed in both forms.
          # ignore_mode defaults to all: no metrics and no traces for these.
          ignored_patterns:
            - /health
            - /health/*
            - /healthz
            - /healthz/*
            - /live
            - /live/*
            - /livez
            - /livez/*
            - /ready
            - /ready/*
            - /readyz
            - /readyz/*
            - /readiness
            - /readiness/*
            - /startup
            - /startup/*
            - /heartbeat
            - /heartbeat/*
            - /ping
            - /ping/*
            - /actuator
            - /actuator/*
            - /metrics
            - /metrics/*
        injector:
          # Pin the SDK payload (ghcr.io/grafana/beyla/inject-sdk-image). Do
          # not use "latest". 2026.11.13.0 is the version Beyla engineering
          # recommended alongside Beyla 3.42/3.43.
          image_version: "2026.11.13.0"
          # Do not set resources.attributes with SDK Injector 0.3.0: the
          # pod, namespace and node attributes then arrive as literal $(VAR)
          # text (grafana/beyla#3128). Do not set otel_exported_signals
          # either, Beyla exits with "expected a pointer to a Struct".
          # CHANGE: <release>-alloy-deployment.<namespace>.
          exporter_otlp_endpoint: http://grafana-cloud-alloy-deployment.monitoring.svc.cluster.local:4318
          exporter_otlp_protocol: http/protobuf
          instrument:
            # opt-in per pod annotation, across all namespaces
            - k8s_pod_annotations:
                k8s.grafana.com/sdk-inject: "true"
            # Alternative: inject every pod in the listed namespaces, no
            # per-pod annotation needed.
            # - k8s_namespace: '{team-a,team-b}'
          # Never inject here even if the annotation is present. The
          # controller already blocks these three in its webhook namespace
          # selector and in a hardcoded denylist, so this is redundant
          # defence that also documents the intent.
          exclude_instrument:
            # CHANGE: monitoring is the release namespace.
            - k8s_namespace: '{kube-system,kube-public,kube-node-lease,monitoring}'
            # Per-pod opt-out, for workloads that already bundle an
            # OpenTelemetry SDK: a second injected SDK can crash-loop them.
            - k8s_pod_annotations:
                k8s.grafana.com/sdk-inject: "false"

          # Supported SDKs https://github.com/open-telemetry/opentelemetry-injector#opentelemetry-injector
          enabled_sdks: [java, dotnet, nodejs, python]
          # <namespace>/<deployment> of the chart-deployed controller. Both
          # follow the release name and namespace.
          webhook:
            # CHANGE: <namespace>/<release>-k8s-injection-controller.
            external_deployment_name: monitoring/grafana-cloud-k8s-injection-controller

# Alloy self-monitoring: scrapes the collectors' own metrics (allow-listed
# to what the Grafana Alloy integration dashboards need).
integrations:
  collector: alloy-daemonset
  alloy:
    instances:
      - name: alloy
        labelSelectors:
          app.kubernetes.io/name: [alloy-daemonset, alloy-deployment, alloy-singleton]
        # CHANGE: release namespace.
        namespaces: [monitoring]

telemetryServices:
  # Required by clusterMetrics.
  kube-state-metrics:
    deploy: true
  # Required by hostMetrics.
  node-exporter:
    deploy: true
  sdkInjector:
    deploy: true
    # The Beyla DaemonSet ServiceAccount: <release>-beyla.
    # CHANGE: <release>-beyla. Any other value makes the webhook reject
    # Beyla's state and nothing gets injected.
    allowedConfigMapWriters: system:serviceaccount:$(POD_NAMESPACE):grafana-cloud-beyla
    metrics:
      annotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portNumber: "8080"
    # Languages the controller injects. Same as its default; narrow here,
    # and mirror the change in injector.enabled_sdks above. The other
    # sdkConfig keys (export, propagators, disableAutoRestart) have no
    # effect here, Beyla owns them.
    sdkConfig:
      enabledSDKs: [nodejs, python, java, dotnet]

# Collector layout follows the Grafana Cloud default (Fleet Management
# onboarding): one clustered DaemonSet for node-local and scraped telemetry,
# one autoscaled Deployment for OTLP. Unlike that default, this file has no
# Fleet Management, so features are configured locally above, and cluster
# events keep their own singleton: chart 4.6.1 does not enable clustering on
# loki.source.kubernetes_events, so a clustered DaemonSet would collect every
# event once per node.
collectors:
  # Pod logs, cluster and host metrics, annotation autodiscovery and the Beyla
  # scrape. Clustering spreads the scrape targets across the node pods;
  # filesystem-log-reader mounts /var/log/pods read-only.
  alloy-daemonset:
    presets: [clustered, filesystem-log-reader, daemonset]
    alloy:
      # podLogsViaOpenTelemetry renders otelcol.receiver.filelog, which is
      # public-preview in Alloy. The chart refuses to render it at the
      # default generally-available level.
      stabilityLevel: public-preview
      # Memory grows with scraped series and tailed log files per node.
      # No CPU limit: throttling delays scrapes and log reads.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
  # OTLP receiver for the injected SDKs and Beyla traces. Scales on load,
  # not on node count. HPA needs metrics-server (present on AKS) and resource
  # requests: without them the Alloy operator refuses to install it
  # (".Values.alloy.resources.requests is required when using autoscaling").
  # The HPA targets are percentages of these requests.
  alloy-deployment:
    presets: [clustered, deployment, otel-receiver]
    alloy:
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          memory: 1Gi
    controller:
      podDisruptionBudget:
        enabled: true
        maxUnavailable: 1
      autoscaling:
        horizontal:
          enabled: true
          # Two replicas so a node drain or rollout never leaves the OTLP
          # endpoint without a pod.
          minReplicas: 2
          maxReplicas: 3
          targetCPUUtilizationPercentage: 75
          targetMemoryUtilizationPercentage: 80
  # Cluster events. Single instance by design.
  alloy-singleton:
    presets: [singleton]
    alloy:
      # Cluster events only, small and steady.
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 256Mi
